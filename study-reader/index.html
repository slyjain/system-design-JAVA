<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="description" content="Read your notes and track what you understand." />
    <title>Study Reader</title>
    <script>
      // Apply the stored or system theme before the app paints. Keep this key
      // consistent with src/useTheme.ts; browser storage can be unavailable.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('study-reader-theme'); } catch (_) { /* use system */ }
        var dark = false;
        try { dark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) { /* use light */ }
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : (dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
