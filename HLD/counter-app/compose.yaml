name: hld-counter-lab
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - counter-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  counter-data:
